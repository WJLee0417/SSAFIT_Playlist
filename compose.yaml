services:
  mysql:
    image: mysql:8.4.4
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    environment:
      TZ: Asia/Seoul
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ssafit_playlist}
      MYSQL_USER: ${MYSQL_USER:-ssafit}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    volumes:
      - ssafit-mysql-data:/var/lib/mysql
      - ./ssafit/src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./ssafit/src/main/resources/sql/demo-snapshot.sql:/docker-entrypoint-initdb.d/02-demo-snapshot.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql --protocol=TCP -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} $${MYSQL_DATABASE} -e 'SELECT 1' >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    image: ssafit-playlist-backend:0.0.1-local
    build:
      context: .
      dockerfile: ssafit/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SERVER_PORT: ${SERVER_PORT:-8080}
      SSAFIT_DB_HOST: mysql
      SSAFIT_DB_PORT: 3306
      SSAFIT_DB_NAME: ${SSAFIT_DB_NAME:-${MYSQL_DATABASE:-ssafit_playlist}}
      SSAFIT_DB_USERNAME: ${SSAFIT_DB_USERNAME:-${MYSQL_USER:-ssafit}}
      SSAFIT_DB_PASSWORD: ${SSAFIT_DB_PASSWORD:?Set SSAFIT_DB_PASSWORD in .env}
      FRONTEND_PUBLIC_ORIGIN: ${FRONTEND_PUBLIC_ORIGIN:-http://127.0.0.1:5173}
      SSAFIT_FRONTEND_ORIGIN: ${SSAFIT_FRONTEND_ORIGIN:-http://127.0.0.1:5173}
      SSAFIT_CORS_ALLOWED_ORIGINS: ${SSAFIT_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-}
      SPOTIFY_AUDIO_FEATURE_ENRICHMENT_ENABLED: ${SPOTIFY_AUDIO_FEATURE_ENRICHMENT_ENABLED:-false}
      AI_RUNNING_REPORT_ENABLED: ${AI_RUNNING_REPORT_ENABLED:-false}
      AI_RUNNING_REPORT_PROVIDER: ${AI_RUNNING_REPORT_PROVIDER:-none}
      AI_RUNNING_REPORT_API_KEY: ${AI_RUNNING_REPORT_API_KEY:-}
      AI_RUNNING_REPORT_BASE_URL: ${AI_RUNNING_REPORT_BASE_URL:-https://api.openai.com/v1}
      AI_RUNNING_REPORT_MODEL: ${AI_RUNNING_REPORT_MODEL:-gpt-4.1-mini}
      AI_RUNNING_REPORT_TIMEOUT: ${AI_RUNNING_REPORT_TIMEOUT:-10s}
      AI_RUNNING_REPORT_PROMPT_VERSION: ${AI_RUNNING_REPORT_PROMPT_VERSION:-ai-running-report-v1}
      AI_RUNNING_REPORT_MAX_OUTPUT_CHARACTERS: ${AI_RUNNING_REPORT_MAX_OUTPUT_CHARACTERS:-1200}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:$${SERVER_PORT:-8080}/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    image: ssafit-playlist-frontend:0.0.1-local
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_JSP_BASE_URL: ${VITE_JSP_BASE_URL:-${FRONTEND_PUBLIC_ORIGIN:-http://127.0.0.1:5173}}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/ >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  ssafit-mysql-data:
