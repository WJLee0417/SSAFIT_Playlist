server:
  port: ${SERVER_PORT:8080}
  error:
    include-binding-errors: never
    include-exception: false
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie

spring:
  application:
    name: ssafit

  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ssafit_playlist?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ssafit
    password: ssafit1234!

  sql:
    init:
      mode: never

mybatis:
  mapper-locations: classpath:/mappers/**/*.xml
  type-aliases-package: com.ssafy.ssafit
  configuration:
    map-underscore-to-camel-case: true

spotify:
  client-id: ${SPOTIFY_CLIENT_ID:}
  client-secret: ${SPOTIFY_CLIENT_SECRET:}
  redirect-uri: ${SPOTIFY_REDIRECT_URI:}
  authorization-base-url: https://accounts.spotify.com
  api-base-url: https://api.spotify.com/v1
  # Current-user ID is read from /me after authorization. No email or playback
  # data is requested; only playlist write scopes are retained.
  scopes:
    - playlist-modify-private
    - playlist-modify-public
  audio-feature-enrichment:
    enabled: ${SPOTIFY_AUDIO_FEATURE_ENRICHMENT_ENABLED:false}

ssafit:
  frontend:
    origin: ${SSAFIT_FRONTEND_ORIGIN:http://127.0.0.1:5173}
    cors-allowed-origins: ${SSAFIT_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
